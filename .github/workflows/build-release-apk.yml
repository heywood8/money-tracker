name: Build Android APK (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Primary build profile (preview = arm64 only; emulator = arm64 + x86_64). A separate x86_64-only APK always builds in parallel and is attached to the release alongside it.'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - emulator
  push:
    tags:
      - 'penny-v*'
    branches:
      - 'dependabot/*'

jobs:
  build:
    name: Build Android APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Both ABIs are attached to the GitHub Release, each suffixed by arch
    # ("<tag>_arm64.apk" + "<tag>_x86_64.apk"). extractApkAsset (AppUpdateService.js)
    # already prefers "_arm64", falling back to any non-x86 .apk, so older installs
    # keep picking the right asset without an app-side change.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            profile: ${{ github.event.inputs.profile || 'preview' }}
            apk_suffix: '_arm64'
          - arch: x86_64
            profile: x86
            apk_suffix: '_x86_64'

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: 🏗 Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: bun install

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔐 Setup credentials.json for signing
        run: |
          mkdir -p android/app
          echo "${{ secrets.MYAPP_UPLOAD_STORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > credentials.json << EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "android/app/keystore.jks",
                "keystorePassword": "${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}",
                "keyAlias": "${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name:  Build APK with EAS
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BUILD_PROFILE: ${{ matrix.profile }}
        run: |
          eas build --platform android --local --profile "$BUILD_PROFILE" --non-interactive

      - name: 📦 Find and rename APK
        id: find_apk
        env:
          REF_NAME: ${{ github.ref_name }}
          APK_SUFFIX: ${{ matrix.apk_suffix }}
        run: |
          # EAS build outputs APK in current directory or android/app/build/outputs/apk
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | grep -v "node_modules" | grep -v unaligned | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

          # Use git ref for filename. Sanitize "/" (present in branch names such
          # as those used for workflow_dispatch runs) so cp does not try to write
          # into a non-existent directory. Tag names like "penny-v*" are unaffected.
          # APK_SUFFIX distinguishes parallel ABI builds (e.g. "_x86_64"); it is
          # empty for the primary arm64 build so its release asset name is unchanged.
          SAFE_NAME="${REF_NAME//\//-}"
          NEW_NAME="${SAFE_NAME}${APK_SUFFIX}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Renamed to: $NEW_NAME"
          ls -lh "$NEW_NAME"

      - name: 🔒 Generate SHA-256 checksum
        id: checksum
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          sha256sum "$APK" > "${APK}.sha256"
          echo "checksum_path=${APK}.sha256" >> $GITHUB_OUTPUT
          echo "SHA-256: $(cat ${APK}.sha256)"

      # Makes the APK downloadable from every run — including manual
      # workflow_dispatch runs off a branch, where there is no release/tag to
      # attach it to. Without this, a dispatched build produces an APK that is
      # discarded when the runner is torn down.
      - name: 📦 Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: penny-apk-${{ matrix.arch }}
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.checksum.outputs.checksum_path }}
          retention-days: 7
          if-no-files-found: error

      - name: 📤 Upload APK and checksum to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.checksum.outputs.checksum_path }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post build summary
        if: github.ref_type == 'tag'
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
          BUILD_ARCH: ${{ matrix.arch }}
          REF_NAME: ${{ github.ref_name }}
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.checksum.outputs.checksum_path }}
        run: |
          echo "## 🚀 Android Build Completed (EAS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** $BUILD_PROFILE ($BUILD_ARCH)" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** $REF_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** $APK_PATH" >> $GITHUB_STEP_SUMMARY
          echo "**SHA-256:** $(cat "$CHECKSUM_PATH")" >> $GITHUB_STEP_SUMMARY
