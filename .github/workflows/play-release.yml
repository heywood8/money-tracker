name: Publish to Google Play

# Builds the production App Bundle and hands it to Google Play through EAS Submit.
#
# The build runs with `--local`, on this runner, exactly like build-release-apk.yml:
# EAS cloud builds are metered (15 Android builds/month on the free plan, ~$1 each
# on paid plans) and this repo cuts a release roughly twice a day, so a cloud build
# per release is not affordable. EAS Submit, by contrast, is free on every plan and
# happily takes a locally built artifact via `--path`, so publishing to Play costs
# no EAS quota at all.
#
# Every release tag publishes itself. release-please cuts `penny-v*`, the tag push
# lands here, and the bundle goes to closed testing without anyone pressing a
# button — the same track that feeds the 12-testers/14-days production-access
# requirement. A dispatched run can still pick a different track, or reuse an
# earlier run's bundle; see docs/GOOGLE_PLAY_RELEASE.md.
on:
  push:
    tags:
      - 'penny-v*'
  workflow_dispatch:
    inputs:
      submit_profile:
        description: 'Play track to publish to. "closed" = closed testing (the alpha track), which is what feeds the 12-testers/14-days production-access requirement, and what a release tag publishes to on its own. "internal" = internal testing, instant, no review, no tester minimum. "production" uploads a draft release you promote by hand.'
        required: true
        default: 'closed'
        type: choice
        options:
          - closed
          - internal
          - production
      aab_run_id:
        description: 'Optional. Reuse the AAB from an earlier run of this workflow instead of building a new one — paste that run''s id. The build takes ~33 minutes and the submit that follows takes ~90 seconds, so a submit that failed on credentials or Play permissions should not cost a second build. Leave empty to build from this ref.'
        required: false
        type: string

# One publish at a time, queued rather than cancelled. Release tags arrive in
# bursts — penny-v0.288.0 and penny-v0.288.1 were 53 seconds apart — and two
# builds in parallel would race into the same track: `autoIncrement` reserves a
# versionCode per build, so whichever submits first decides whether the other is
# rejected as a lower code or quietly leaves testers on the older bundle.
# Queuing keeps build order, and therefore versionCode order, equal to tag order.
#
# `cancel-in-progress: false` on purpose: cancelling would also be able to kill a
# run during its submit step, after the bundle has been handed to Play.
concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build AAB and submit to Play (${{ github.event.inputs.submit_profile || 'closed' }})
    runs-on: ubuntu-latest
    # The build alone takes ~33 minutes. Without a bound, a Gradle build that hangs
    # (a documented failure mode here — see CLAUDE.md) would sit on the default six
    # hours, unattended, twice a day, holding the concurrency slot the whole time.
    timeout-minutes: 60
    permissions:
      contents: read
      # Required to download the `penny-aab` artifact from an earlier run.
      actions: read

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      # `aab_run_id` only exists on a dispatched run: a tag push carries no inputs at
      # all, so this reads as empty there and the build path is what runs.
      - name: 🏗 Setup Java
        if: github.event.inputs.aab_run_id == ''
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: bun install

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The same upload keystore the APK workflow signs with. Play App Signing
      # re-signs the bundle with the app signing key on Google's side, so what
      # matters here is only that this key matches the upload certificate
      # registered for com.heywood8.monkeep.
      - name: 🔐 Setup credentials.json for signing
        if: github.event.inputs.aab_run_id == ''
        run: |
          mkdir -p android/app
          echo "${{ secrets.MYAPP_UPLOAD_STORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > credentials.json << EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "android/app/keystore.jks",
                "keystorePassword": "${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}",
                "keyAlias": "${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      # DISTRIBUTION_CHANNEL=play comes from the profile itself (eas.json) and is what
      # drops REQUEST_INSTALL_PACKAGES and the in-app updater from this binary —
      # Play forbids an app updating itself by any route other than Play.
      - name: 🏗 Build production AAB with EAS
        if: github.event.inputs.aab_run_id == ''
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          eas build --platform android --local --profile production \
            --non-interactive --output "${{ runner.temp }}/penny.aab"
          ls -lh "${{ runner.temp }}/penny.aab"
          echo "AAB_PATH=${{ runner.temp }}/penny.aab" >> "$GITHUB_ENV"

      # The bundle an earlier run already produced. Identical to rebuilding the same
      # ref, so a submit that failed for a reason outside the bundle — a missing
      # service account key, a Play permission not yet granted — is retried in
      # seconds rather than after another full build.
      - name: 📥 Reuse the AAB from run ${{ github.event.inputs.aab_run_id }}
        if: github.event.inputs.aab_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: penny-aab
          run-id: ${{ github.event.inputs.aab_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/reused-aab

      - name: 📥 Locate the reused AAB
        if: github.event.inputs.aab_run_id != ''
        run: |
          AAB="${{ runner.temp }}/reused-aab/penny.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error::No penny.aab in the artifact from run ${{ github.event.inputs.aab_run_id }}."
            exit 1
          fi
          ls -lh "$AAB"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      # No service account key is handled here. EAS stores the Google Service
      # Account key with the project's Android credentials (encrypted at rest on
      # Expo's servers) and reuses it for every submission, which is Expo's own
      # documented setup and keeps a Play Release-manager private key out of CI
      # entirely. Add it once at
      # https://expo.dev/accounts/lopatinikita/projects/app/credentials, or with
      # `eas credentials -p android`. docs/GOOGLE_PLAY_RELEASE.md also covers the
      # alternative of keeping the key in a repository secret.
      - name: 🚀 Submit to Google Play
        env:
          SUBMIT_PROFILE: ${{ github.event.inputs.submit_profile || 'closed' }}
        run: |
          eas submit --platform android --profile "$SUBMIT_PROFILE" \
            --path "$AAB_PATH" --non-interactive

      - name: 📦 Upload AAB as workflow artifact
        if: always() && github.event.inputs.aab_run_id == ''
        uses: actions/upload-artifact@v7
        with:
          name: penny-aab
          path: ${{ runner.temp }}/penny.aab
          retention-days: 7
          if-no-files-found: warn

      - name: Post summary
        if: always()
        env:
          SUBMIT_PROFILE: ${{ github.event.inputs.submit_profile || 'closed' }}
        run: |
          echo "## 🚀 Google Play submission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Submit profile:** $SUBMIT_PROFILE" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "$SUBMIT_PROFILE" = "production" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The production release was uploaded as a **draft**. Promote it in Play Console when you are ready." >> $GITHUB_STEP_SUMMARY
          fi
