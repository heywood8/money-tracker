appId: com.heywood8.monkeep
---
# Wait for language selection screen to fully load
- extendedWaitUntil:
    visible: "Welcome to Penny"
    timeout: 30000

# Screenshot 0: Language selection screen (only captured once, no dark/light variant)
- takeScreenshot: 00_language_selection

# Select English and continue
- tapOn: "English"
- tapOn: "Continue"

# The release build checks for updates on launch, and on CI there is always a newer
# release than the one just built — the prompt then covers the app and takes
# everything under it out of the accessibility tree, so every later step fails to
# find its target. Give it a moment to appear, then dismiss it if it did.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Update available"
    commands:
      - tapOn: "Later"
      - waitForAnimationToEnd:
          timeout: 1000

# Wait for main app to load (Operations tab is the default)
- extendedWaitUntil:
    visible: "Operations"
    timeout: 30000

# ============================================
# LIGHT MODE SCREENSHOTS (default)
# ============================================

# Screenshot 1: Operations screen (default first tab)
- takeScreenshot: 01_operations_light

# Screenshot 1a: long-press action menu. The lifted clone must sit exactly on top of
# the row it copies — this frame is the regression check for that (see
# OverlayHostContext). Captured here, right after the plain list, so the two frames
# can be compared row-for-row.
- longPressOn:
    id: "operation-item-0"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 10_action_menu_light
# Dismiss with the hardware back button: the overlay is not a native window, so this
# also exercises the BackHandler the menu wires up in place of onRequestClose.
- back
- waitForAnimationToEnd:
    timeout: 1000

# Screenshot: the operation editor and its category picker. The picker used to be
# a SECOND bottom sheet stacked on this one, landing its rounded top edge in the
# middle of the form; it is now a subpanel that covers the whole card. These two
# frames are the regression check for that (see OperationModal's overlayPanel).
# Row 1, not row 0: the seed data's last operation is a transfer, and a transfer
# has a destination-account row where the category button sits — row 0 opened the
# editor but never the picker.
- tapOn:
    id: "operation-item-1"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 11_operation_modal_light
# Guarded anyway — if the seed order ever shifts, this skips instead of aborting
# every screenshot after it.
- runFlow:
    when:
      visible:
        id: "category-input"
    commands:
      - tapOn:
          id: "category-input"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 12_category_picker_light
      # Back closes the PANEL, not the sheet under it — this is onBackIntercept.
      - back
      - waitForAnimationToEnd:
          timeout: 1000
# Second back leaves the operation editor.
- back
- waitForAnimationToEnd:
    timeout: 1000

# Screenshot 1b: Transfer mode of QuickAdd (shows target account shortcuts below calculator)
- tapOn: "Transfer"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05_transfer_light

# Screenshot 1c: Multi-currency transfer (select different-currency account, enter amount)
# "All accounts" only renders past 8 accounts (OperationFormFields), and the seed data
# has 4 — the picker step this flow used to go through no longer exists, so tap the
# target account straight from the shortcut row.
- tapOn: "EUR Cash"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "calc-btn-1"
- tapOn:
    id: "calc-btn-2"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 06_multicurrency_transfer_light
# Switch back to expense type for the rest of the flow
- tapOn: "Expense"
- waitForAnimationToEnd:
    timeout: 2000

# Screenshot: Filter modal
- tapOn:
    id: "search-input-container"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "filters-toggle-button"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 09_filter_modal_light

# Close filter modal
- tapOn:
    id: "close-search-button"
- waitForAnimationToEnd:
    timeout: 1000

# Navigate to Graphs tab
- tapOn: "Graphs"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02_graphs_light

# Settings is a TAB now, not a modal behind a header button — `settings-button`
# and `settings-close-button` have not existed for a long time.
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07_settings_light

# Accounts and Categories are subpanels of Settings now, not tabs of their own.
# (The Accounts TAB still exists, but it is off by default — see
# DisplaySettingsContext — so tapping it on a fresh install finds nothing.)
- tapOn:
    id: "settings-accounts-row"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03_accounts_light
- tapOn:
    id: "settings-subpanel-back"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    id: "settings-categories-row"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04_categories_light
- tapOn:
    id: "settings-subpanel-back"
- waitForAnimationToEnd:
    timeout: 1000

# The Planned tab is the Budget tab now. It is on by default, unlike Accounts.
- tapOn: "Budget"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08_budget_light

# ============================================
# SWITCH TO DARK MODE
# ============================================

# The sun/moon button in the header is gone — the theme is a toggle row under
# Settings -> Appearance now. The light half ends on the Budget tab, so the flow
# goes back through Settings to flip it.
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "settings-appearance-row"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "settings-theme-row"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "settings-subpanel-back"
- waitForAnimationToEnd:
    timeout: 1000

# ============================================
# DARK MODE SCREENSHOTS
# ============================================

# Navigate to Operations tab (gives theme time to propagate)
- tapOn: "Operations"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01_operations_dark

# Screenshot: the operation editor and its category picker. The picker used to be
# a SECOND bottom sheet stacked on this one, landing its rounded top edge in the
# middle of the form; it is now a subpanel that covers the whole card. These two
# frames are the regression check for that (see OperationModal's overlayPanel).
# Row 1, not row 0: the seed data's last operation is a transfer, and a transfer
# has a destination-account row where the category button sits — row 0 opened the
# editor but never the picker.
- tapOn:
    id: "operation-item-1"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 11_operation_modal_dark
# Guarded anyway — if the seed order ever shifts, this skips instead of aborting
# every screenshot after it.
- runFlow:
    when:
      visible:
        id: "category-input"
    commands:
      - tapOn:
          id: "category-input"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 12_category_picker_dark
      # Back closes the PANEL, not the sheet under it — this is onBackIntercept.
      - back
      - waitForAnimationToEnd:
          timeout: 1000
# Second back leaves the operation editor.
- back
- waitForAnimationToEnd:
    timeout: 1000

# Screenshot: Filter modal (dark)
- tapOn:
    id: "search-input-container"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "filters-toggle-button"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 09_filter_modal_dark

# Close filter modal
- tapOn:
    id: "close-search-button"
- waitForAnimationToEnd:
    timeout: 1000

# Screenshot 5 dark: Transfer mode of QuickAdd
- tapOn: "Transfer"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05_transfer_dark

# Screenshot 6 dark: Multi-currency transfer. Same as the light half — the
# "All accounts" picker only renders past 8 accounts and the seed has 4, so the
# target comes straight off the shortcut row. The light half was fixed for this
# and the dark half was left behind, which no one saw because the run never got
# this far.
- tapOn: "EUR Cash"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "calc-btn-1"
- tapOn:
    id: "calc-btn-2"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 06_multicurrency_transfer_dark
- tapOn: "Expense"
- waitForAnimationToEnd:
    timeout: 2000

# Navigate to Graphs tab
- tapOn: "Graphs"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02_graphs_dark

# Settings is a TAB now, not a modal behind a header button.
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07_settings_dark

# Accounts and Categories are subpanels of Settings now, not tabs of their own.
- tapOn:
    id: "settings-accounts-row"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03_accounts_dark
- tapOn:
    id: "settings-subpanel-back"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    id: "settings-categories-row"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04_categories_dark
- tapOn:
    id: "settings-subpanel-back"
- waitForAnimationToEnd:
    timeout: 1000

# The Planned tab is the Budget tab now.
- tapOn: "Budget"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08_budget_dark
